name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b682449dd4133f4f891319e2e0dd9c" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -exec {} "platforms;android-36" \; 2>/dev/null || true

      - name: Build Web Bundle
        working-directory: ./client
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./client/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk client/android/app/build/outputs/apk/debug/CrowdMonitor.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrowdMonitor-APK
          path: client/android/app/build/outputs/apk/debug/CrowdMonitor.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: "CrowdMonitor Mobile v1.0.1 (Server Config Support)"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### 📱 CrowdMonitor Android App v1.0.1

            **What's New:**
            - ⚙️ **Configurable Server Address**: Connect your phone to your PC's backend over Wi-Fi/LAN (`http://<PC_IP>:3001`).
            - 🔌 **Dynamic Test Connection**: 1-click connection ping with latency and server uptime test.
            - 🛡️ **Smooth Admin Login**: Auto-fills and authenticates directly with your live Node.js server.
            
            **How to Connect:**
            1. Download and install `CrowdMonitor.apk` below.
            2. Run `npm run dev` in your PC's `server` folder.
            3. Tap **Server: Auto** at the top of the app, enter your PC's IP address (default is set to `http://10.124.148.23:3001`), and tap **Test Connection** -> **Save & Connect**.
            4. Log in as admin (`admin` / `admin123`) or view live visitor data!
          files: |
            client/android/app/build/outputs/apk/debug/CrowdMonitor.apk
