name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web Bundle
        working-directory: ./client
        run: |
          npm install --include=dev
          npm run build
          npx cap sync android

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./client/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrowdMonitor-app-debug
          path: client/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "CrowdMonitor Mobile v1.0.0"
          draft: false
          prerelease: false
          body: |
            ### 📱 CrowdMonitor Android App (One-Click Download)
            
            Download and install **CrowdMonitor** directly onto your phone:
            
            - **Direct Download**: Tap `app-debug.apk` under **Assets** below.
            - **Installation**: Tap the downloaded file to install on your Android device (allow unknown sources if prompted).
          files: |
            client/android/app/build/outputs/apk/debug/app-debug.apk
